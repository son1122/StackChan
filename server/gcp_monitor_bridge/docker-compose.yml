version: "3.8"

services:
  gcp-bridge:
    build: .
    container_name: stackchan-gcp-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-demo-gcp-project}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-sa.json
      - PROMETHEUS_URL=${PROMETHEUS_URL:-}
    volumes:
      - ./credentials:/app/credentials:ro
