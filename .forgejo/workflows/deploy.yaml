name: Deploy StackChan GCP Bridge to NAS

on:
  push:
    branches:
      - main
    paths:
      - 'server/gcp_monitor_bridge/**'
      - '.forgejo/workflows/deploy.yaml'

jobs:
  deploy:
    name: Build & Run Bridge Container
    runs-on: [ nas ]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        timeout-minutes: 2
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          echo "Checking out ${REPO} @ ${SHA}..."
          git init
          git config --global --add safe.directory "$PWD"
          git config http.sslVerify false

          # Authenticate with token directly to prevent credential prompt from waiting on stdin
          if git fetch --depth 1 "http://oauth2:${TOKEN}@forgejo:3000/${REPO}.git" "${SHA}"; then
            echo "Fetched successfully from internal Forgejo network"
          elif git fetch --depth 1 "https://oauth2:${TOKEN}@${SERVER_URL#*://}/${REPO}.git" "${SHA}"; then
            echo "Fetched successfully from domain"
          else
            echo "Fallback shallow fetch..."
            git -c http.extraHeader="Authorization: token ${TOKEN}" fetch --depth 1 "http://forgejo:3000/${REPO}.git" "${SHA}"
          fi
          git checkout --force FETCH_HEAD
          echo "Checked out commit $(git rev-parse --short HEAD)"

      - name: Deploy Bridge Container via Docker Compose
        timeout-minutes: 15
        env:
          BRIDGE_PORT: ${{ secrets.BRIDGE_PORT }}
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_IDS: ${{ secrets.GCP_PROJECT_IDS }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          echo "Runner Docker Environment:"
          docker --version
          docker compose version

          cd server/gcp_monitor_bridge

          # Stop previous container first to release host port
          docker compose down || true

          # Target host port configured on Pangolin reverse proxy (default 8099)
          export BRIDGE_PORT="${BRIDGE_PORT:-8099}"
          echo "Selected Host Bridge Port: ${BRIDGE_PORT}"

          # Export environment for docker compose
          export GCP_PROJECT_ID="${GCP_PROJECT_ID:-insurverse-develop}"
          export GCP_PROJECT_IDS="${GCP_PROJECT_IDS:-insurverse-develop,insurverse-uat}"
          export GCP_SA_JSON="${GCP_SA_JSON:-}"
          export BRIDGE_API_KEY="${BRIDGE_API_KEY:-}"
          export BRIDGE_USERNAME="${BRIDGE_USERNAME:-stackchan1}"
          export BRIDGE_PASSWORD="${BRIDGE_PASSWORD:-qRHKJXR0Ntieu3LmpmKKKFpP}"
          export PROMETHEUS_URL="${PROMETHEUS_URL:-}"

          # Rebuild and launch detached
          docker compose up -d --build --remove-orphans

          # If GCP Service Account JSON secret is provided, inject it securely into container
          if [ -n "$GCP_SA_JSON" ]; then
            echo "Injecting GCP Service Account credentials into container..."
            printf "%s" "$GCP_SA_JSON" | docker exec -i stackchan-gcp-bridge sh -c 'cat > /app/credentials/gcp-sa.json && chmod 600 /app/credentials/gcp-sa.json'
          fi

          # Verify container health
          sleep 4
          docker ps --filter name=stackchan-gcp-bridge --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          # Probe live healthz endpoint
          echo "Probing GCP Bridge /healthz on port ${BRIDGE_PORT}..."
          docker run --rm --net=host python:3.12-slim python3 -c "import urllib.request; resp = urllib.request.urlopen('http://127.0.0.1:${BRIDGE_PORT}/healthz', timeout=5); print('Live health check successful! HTTP status:', resp.getcode(), resp.read().decode())" || echo "Health check probe finished."
